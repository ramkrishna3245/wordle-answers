name: Update dataset

on:
  schedule:
    # 05:30 UTC daily - runs after the new Wordle answer is published
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch new answers
        run: node scripts/update.js

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/wordle-answers.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/wordle-answers.json
            git commit -m "chore: update answers ($(git rev-parse --short HEAD))"
            git push
            echo "committed"
          else
            echo "no changes"
          fi
