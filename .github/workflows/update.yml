name: Update dataset

on:
  schedule:
    # 05:30 UTC daily - runs after the new Wordle answer is published
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch new answers
        run: node scripts/update.js

      - name: Rebuild CSV, stats and the GitHub Pages browser
        run: |
          python3 scripts/build_data.py
          python3 scripts/build_pages.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh answers and dataset pages"
            git push
            echo "committed"
          fi

      - name: Refresh the live site
        # anywordsolver.com/update-wordle.php re-fetches the official feed and
        # rewrites wordle-answers.js, so the site never runs out of answers.
        # This replaces a server-side cron job entirely - it is free.
        run: |
          curl -sS --max-time 60 https://anywordsolver.com/update-wordle.php
          curl -sS --max-time 60 https://anywordsolver.com/update-solitaire-daily.php
          echo ""
